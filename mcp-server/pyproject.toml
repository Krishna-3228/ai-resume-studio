[project]
name = "resume-studio-mcp"
version = "0.1.0"
description = "MCP server for AI Resume Studio"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.8",
]

[project.scripts]
resume-studio-mcp = "mcp_server.server:main"

[tool.uv.build-backend]
module-name = "mcp_server"
module-root = "src"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
